<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Görev Sicili</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: yapışkan üst bar → özet şeridi → solda kişi kartları, sağda kapaklı profil; telefonda tek sütun + yüzen buton */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --surface-2: #f7f8f6;
  --ink: #121a17;
  --muted: #5f6b66;
  --line: #e1e6e2;
  --accent: #0f766e;
  --accent-ink: #ffffff;
  --accent-soft: #d9f0ec;
  --amber: #b45309; --amber-soft: #fdf0dc;
  --ok: #15803d; --ok-soft: #dcf3e3;
  --blue: #1d4ed8; --blue-soft: #e0e8fd;
  --grey: #4b5563; --grey-soft: #eceeed;
  --danger: #c2410c;
  --shadow-sm: 0 1px 2px rgba(18,26,23,.05);
  --shadow: 0 1px 2px rgba(18,26,23,.04), 0 12px 32px -12px rgba(18,26,23,.14);
  --glass: rgba(242,244,241,.78);
  --r: 18px;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b100e; --surface: #141b18; --surface-2: #19211e; --ink: #e8efec; --muted: #94a39d; --line: #26302c;
    --accent: #2dd4bf; --accent-ink: #062320; --accent-soft: #123a35;
    --amber: #fbbf24; --amber-soft: #3a2a0e; --ok: #4ade80; --ok-soft: #12301d;
    --blue: #93b4ff; --blue-soft: #1a2647; --grey: #b6c0bc; --grey-soft: #222b28; --danger: #fb923c;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 36px -14px rgba(0,0,0,.6);
    --glass: rgba(11,16,14,.75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b100e; --surface: #141b18; --surface-2: #19211e; --ink: #e8efec; --muted: #94a39d; --line: #26302c;
  --accent: #2dd4bf; --accent-ink: #062320; --accent-soft: #123a35;
  --amber: #fbbf24; --amber-soft: #3a2a0e; --ok: #4ade80; --ok-soft: #12301d;
  --blue: #93b4ff; --blue-soft: #1a2647; --grey: #b6c0bc; --grey-soft: #222b28; --danger: #fb923c;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 36px -14px rgba(0,0,0,.6);
  --glass: rgba(11,16,14,.75);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.inner { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Üst bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.topbar .inner { display: flex; align-items: center; gap: 14px; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 10px; flex: none; }
.logo-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1rem; letter-spacing: -.02em; }
.logo-name { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; line-height: 1; }
.logo-name small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .72rem; color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.search-wrap { flex: 1 1 auto; max-width: 440px; margin-left: auto; position: relative; min-width: 0; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px 9px 36px; outline: none; transition: border-color .15s, box-shadow .15s; }
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
@media (max-width: 680px) { .logo-name small { display: none; } .add-top { display: none !important; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 16px; font-weight: 600; font-size: .92rem; transition: transform .12s, background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.danger.sure { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { padding: 6px 12px; font-size: .84rem; border-radius: 10px; }
.btn svg { width: 16px; height: 16px; }

/* Özet şeridi */
.overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding-block: 22px 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.stat b { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; line-height: 1.1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); font-weight: 500; }
.ig-card { grid-column: span 2; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; overflow: hidden; }
@media (max-width: 640px) {
  .overview { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 12px; border-radius: 14px; }
  .stat b { font-size: 1.5rem; }
  .stat span { font-size: .72rem; }
  .ig-card { grid-column: 1 / -1; }
}
.ig-badge { width: 42px; height: 42px; border-radius: 13px; flex: none; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #f59e0b, #e1306c 55%, #7c3aed); }
.ig-badge svg { width: 22px; height: 22px; }
.ig-text { flex: 1 1 160px; min-width: 0; display: grid; gap: 1px; }
.ig-text .lbl { font-size: .78rem; color: var(--muted); font-weight: 500; }
.ig-text a { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; word-break: break-all; }
.ig-text a:hover { color: var(--accent); }
.ig-text .empty-ig { font-weight: 600; }
.ig-form { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; min-width: 0; }
.ig-form input { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 7px 11px; }

/* Gündem / duyurular */
.agenda { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px; margin-bottom: 22px; display: grid; gap: 12px; box-shadow: var(--shadow-sm); }
.agenda-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.agenda-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -.02em; margin: 0 8px 0 0; display: inline; }
.agenda-head .muted { font-size: .85rem; }
.ann-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
.ann { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); transition: transform .15s, box-shadow .15s, border-color .15s; }
.ann:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.ann-date { display: grid; justify-items: center; align-content: center; height: 62px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); line-height: 1.05; }
.ann-date b { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ann-date span { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ann.is-today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ann.is-today .ann-date { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ann.is-today .ann-date span { color: inherit; opacity: .85; }
.ann.is-past { opacity: .62; }
.ann-body { display: grid; gap: 3px; min-width: 0; }
.ann-top { display: flex; flex-wrap: wrap; gap: 5px; }
.when-pill, .imp-pill, .ex-pill { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.when-pill { background: var(--accent-soft); color: var(--accent); }
.imp-pill { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.ex-pill { background: var(--grey-soft); color: var(--muted); font-family: var(--f-mono); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
.ann-title { font-weight: 700; font-size: 1rem; line-height: 1.3; }
.ann-meta { font-size: .8rem; color: var(--muted); }
.ann-text { font-size: .88rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ann-empty { grid-column: 1 / -1; padding: 18px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); text-align: center; }
#ann-past-btn { justify-self: start; }
label.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; }
label.check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 640px) { .agenda { padding: 14px; border-radius: 20px; } }

/* Ana düzen */
.grid { display: grid; grid-template-columns: minmax(270px, 350px) 1fr; gap: 22px; align-items: start; padding-bottom: 96px; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
.shelf { display: flex; flex-direction: column; gap: 12px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
@media (max-width: 860px) { .shelf { position: static; } }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .8rem; font-weight: 600; color: var(--muted); transition: all .15s; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip i { font-style: normal; opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }

.list { display: flex; flex-direction: column; gap: 8px; }
.row { position: relative; display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 10px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s, border-color .15s; }
.row:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.row[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.row .who { min-width: 0; }
.row .name { font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: .82rem; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--grey); }
.dot.s-gorevde { background: var(--ok); } .dot.s-terfi { background: var(--blue); } .dot.s-emekli { background: var(--amber); }

.avatar { width: 46px; height: 46px; border-radius: 14px; object-fit: cover; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; overflow: hidden; background: var(--hue-grad, var(--accent)); }
.avatar.big { width: 104px; height: 104px; border-radius: 28px; font-size: 2.4rem; border: 5px solid var(--surface); box-shadow: var(--shadow); }

/* Profil */
.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
.cover { height: 132px; background: var(--hue-grad, var(--accent)); position: relative; }
.cover::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.22) 1.2px, transparent 1.3px); background-size: 16px 16px; mask-image: linear-gradient(90deg, transparent, #000 70%); -webkit-mask-image: linear-gradient(90deg, transparent, #000 70%); }
.cover .tag-sample { position: absolute; left: 16px; top: 14px; z-index: 1; font-family: var(--f-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; background: rgba(0,0,0,.28); color: #fff; padding: 3px 9px; border-radius: 999px; backdrop-filter: blur(6px); }
.p-head { padding: 0 24px 6px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 18px; margin-top: -52px; position: relative; }
.p-head .actions { margin-left: auto; display: flex; gap: 8px; padding-bottom: 6px; }
.p-id { padding: 10px 24px 4px; }
.p-id h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -.03em; line-height: 1.05; margin: 0; text-wrap: balance; }
.p-id .now { font-size: 1.02rem; color: var(--muted); font-weight: 500; margin-top: 4px; }
.meta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.mchip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: .82rem; font-weight: 500; }
.mchip svg { width: 14px; height: 14px; color: var(--muted); }
.mchip a { color: var(--accent); text-decoration: none; font-weight: 600; }
.mchip a:hover { text-decoration: underline; }
.about { padding: 14px 24px 0; max-width: 68ch; margin: 0; }

.block { padding: 22px 24px; }
.block-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.block-title h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; letter-spacing: -.02em; margin: 0; }
.block-title small { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); }

/* Görev yolculuğu */
.journey { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; position: relative; }
.journey::before { content: ""; position: absolute; left: 19px; top: 24px; bottom: 24px; width: 2px; background: linear-gradient(var(--line), var(--line)); }
.stop { display: grid; grid-template-columns: 40px 1fr; gap: 12px; position: relative; }
.stop .num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line); font-family: var(--f-mono); font-weight: 500; font-size: .85rem; color: var(--muted); z-index: 1; }
.stop.current .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 5px var(--accent-soft); }
.stop .card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; }
.stop .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; align-items: baseline; }
.duty { font-weight: 700; font-size: 1rem; }
.when { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.when .live { color: var(--accent); font-weight: 500; }
.place { display: flex; align-items: center; gap: 5px; color: var(--accent); font-weight: 600; font-size: .9rem; margin-top: 2px; }
.place svg { width: 14px; height: 14px; flex: none; }
.note { margin: 6px 0 0; font-size: .92rem; color: var(--muted); }

/* Bugün */
.today { margin: 0 24px 24px; border-radius: 20px; padding: 18px 20px; display: grid; gap: 8px; background: var(--st-soft, var(--grey-soft)); border: 1px solid var(--line); }
.today .lbl { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--st, var(--grey)); display: flex; align-items: center; gap: 8px; }
.today .lbl .dot { background: var(--st, var(--grey)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--st, var(--grey)) 20%, transparent); }
.today .big { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; letter-spacing: -.02em; line-height: 1.2; }
.today p { margin: 0; max-width: 66ch; }
.st-gorevde { --st: var(--ok); --st-soft: var(--ok-soft); }
.st-terfi { --st: var(--blue); --st-soft: var(--blue-soft); }
.st-emekli { --st: var(--amber); --st-soft: var(--amber-soft); }
.st-ayrildi, .st-diger, .st-vefat { --st: var(--grey); --st-soft: var(--grey-soft); }

.empty { padding: 56px 24px; text-align: center; color: var(--muted); display: grid; justify-items: center; gap: 10px; }
.empty .ill { width: 72px; height: 72px; border-radius: 22px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.empty .ill svg { width: 34px; height: 34px; }
.empty h2 { font-family: var(--f-display); color: var(--ink); margin: 0; letter-spacing: -.02em; }
.empty p { margin: 0; max-width: 40ch; }
.notice { font-size: .8rem; color: var(--muted); margin: 0; }
.muted { color: var(--muted); }

/* Yüzen buton */
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 25; width: 58px; height: 58px; border-radius: 18px; border: none; background: var(--ink); color: var(--bg); box-shadow: 0 12px 28px -8px rgba(0,0,0,.45); display: none; place-items: center; }
.fab svg { width: 26px; height: 26px; }
@media (max-width: 680px) { .fab { display: grid; } }

/* Form */
dialog { border: none; border-radius: 24px; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(8,12,10,.5); backdrop-filter: blur(4px); }
@media (max-width: 600px) {
  dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 24px 24px 0 0; max-height: 92dvh; }
}
.form { display: flex; flex-direction: column; max-height: inherit; }
.form header { padding: 18px 22px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.form header h2 { font-family: var(--f-display); font-weight: 800; letter-spacing: -.02em; margin: 0; font-size: 1.4rem; }
.form .body { padding: 4px 22px 18px; display: grid; gap: 16px; overflow-y: auto; }
.form footer { padding: 12px 22px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
.group { display: grid; gap: 12px; }
.group-title { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
.full { grid-column: 1 / -1; }
label.f { display: grid; gap: 5px; font-size: .82rem; font-weight: 600; min-width: 0; }
label.f input, label.f select, label.f textarea { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; font-weight: 400; outline: none; transition: border-color .15s, box-shadow .15s; }
label.f input:focus, label.f select:focus, label.f textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
textarea { resize: vertical; min-height: 70px; }
.duty-row { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; background: var(--surface-2); }
.duty-row label.f input, .duty-row label.f textarea { background: var(--surface); }

<script>
(function () {
  const STATUS = { gorevde: "Görevde", terfi: "Terfi etti", emekli: "Emekli", ayrildi: "Ayrıldı", vefat: "Vefat etti", diger: "Diğer" };
  const LS_KEY = "gorev-sicili-v1";
  const IG_KEY = "gorev-sicili-instagram";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const initials = (n) => (n || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toLocaleUpperCase("tr");
  const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const igHandle = (s) => {
    let t = String(s || "").trim();
    const m = t.match(/instagram\.com\/([^/?#\s]+)/i);
    if (m) t = m[1];
    t = t.replace(/^@+/, "").replace(/\/+$/, "");
    return /^[A-Za-z0-9._]{1,30}$/.test(t) ? t : "";
  };
  const igLink = (h) => `<a href="https://www.instagram.com/${encodeURIComponent(h)}/" target="_blank" rel="noopener">@${esc(h)}</a>`;
  // İsimden sabit bir renk tonu → kişiye özel kapak
  const hueOf = (s) => { let h = 0; for (const ch of String(s || "")) h = (h * 31 + ch.codePointAt(0)) % 360; return h; };
  const grad = (name) => { const h = hueOf(name); return `linear-gradient(135deg, hsl(${h} 62% 42%), hsl(${(h + 48) % 360} 70% 52%))`; };

  const I = {
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    cake: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M12 11V7M4 15c2.5 1.5 5.5 1.5 8 0s5.5-1.5 8 0"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>',
    ig: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
    folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'
  };

  const EXAMPLES = [
    { id: "ornek-1", example: true, name: "Ayşe Demir", born: "1972", home: "Trabzon",
      desc: "Matematik öğretmeni olarak başladı, Karadeniz'deki köy okullarında yıllarca çalıştı.",
      duties: [
        { place: "Uzungöl İlkokulu, Çaykara", role: "Sınıf öğretmeni", start: "1995", end: "2001", note: "Köyde ilk bilgisayar sınıfını kurdu." },
        { place: "Of Anadolu Lisesi", role: "Matematik öğretmeni", start: "2001", end: "2012", note: "Öğrencileri iki kez bölge birincisi oldu." },
        { place: "Trabzon İl Milli Eğitim", role: "Şube müdürü", start: "2012", end: "", note: "" } ],
      status: "terfi", now: "İl Milli Eğitim Şube Müdürü", story: "Öğretmenlikten idareciliğe geçti; köy okullarındaki tecrübesiyle taşımalı eğitim planını hazırladı." },
    { id: "ornek-2", example: true, name: "Mehmet Kaya", born: "1958", home: "Erzurum",
      desc: "Uzun yıllar sahada çalışmış bir orman muhafaza memuru.",
      duties: [
        { place: "Sarıkamış Orman İşletmesi", role: "Orman muhafaza memuru", start: "1980", end: "1994", note: "Büyük yangında ekibini yönetti." },
        { place: "Bolu Orman Bölge Müdürlüğü", role: "Bölge şefi", start: "1994", end: "2018", note: "" } ],
      status: "emekli", now: "Emekli, köyünde arıcılık yapıyor", story: "2018'de emekli oldu. Şimdi gençlere doğa yürüyüşleri düzenliyor." },
    { id: "ornek-3", example: true, name: "Zeynep Arslan", born: "1990", home: "İzmir", desc: "Acil servis hemşiresi.",
      duties: [
        { place: "Hakkari Devlet Hastanesi", role: "Acil servis hemşiresi", start: "2013", end: "2017", note: "Zorunlu hizmetini burada tamamladı." },
        { place: "İzmir Şehir Hastanesi", role: "Sorumlu hemşire", start: "2017", end: "", note: "" } ],
      status: "gorevde", now: "Sorumlu hemşire", story: "" }
  ];

  let people = [], selectedId = null, filter = "all", query = "";
  let db = null, mode = "local", editing = null, photoData = "", siteIg = "";

  /* ---------- kayıt ---------- */
  function lsRead() { try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
  function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(people)); } catch (e) {} }
  async function savePerson(p) {
    if (mode === "db") { const body = JSON.parse(JSON.stringify(p)); delete body.id; await db.collection("people").doc(p.id).set(body); }
    else { const i = people.findIndex((x) => x.id === p.id); if (i >= 0) people[i] = p; else people.push(p); lsWrite(); render(); }
  }
  async function removePerson(id) {
    if (mode === "db") await db.collection("people").doc(id).delete();
    else { people = people.filter((x) => x.id !== id); lsWrite(); render(); }
  }

  /* ---------- hesabın Instagram'ı ---------- */
  function renderIg() {
    $("ig-view").innerHTML = siteIg
      ? `<span class="lbl">Instagram hesabımız</span><span>${igLink(siteIg)}</span>`
      : `<span class="lbl">Instagram hesabımız</span><span class="empty-ig">Henüz eklenmedi</span>`;
    let b = $("ig-edit");
    if (!b) { b = document.createElement("button"); b.id = "ig-edit"; b.type = "button"; b.className = "btn small"; $("ig-bar").insertBefore(b, $("ig-form")); }
    b.textContent = siteIg ? "Değiştir" : "Instagram ekle";
    b.onclick = () => { $("ig-view").hidden = true; b.hidden = true; $("ig-form").hidden = false; $("ig-input").value = siteIg ? "@" + siteIg : ""; $("ig-input").focus(); };
  }
  function closeIgForm() { $("ig-form").hidden = true; $("ig-view").hidden = false; if ($("ig-edit")) $("ig-edit").hidden = false; }
  $("ig-cancel").onclick = closeIgForm;
  $("ig-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const raw = $("ig-input").value.trim(), h = igHandle(raw);
    if (raw && !h) { $("ig-input").setCustomValidity("Geçerli bir Instagram kullanıcı adı yaz (harf, rakam, nokta, alt çizgi)."); $("ig-input").reportValidity(); return; }
    $("ig-input").setCustomValidity("");
    try {
      if (mode === "db") await db.doc("settings/site").set({ instagram: h });
      else { try { localStorage.setItem(IG_KEY, h); } catch (err) {} }
      siteIg = h; closeIgForm(); renderIg();
    } catch (err) { $("ig-input").setCustomValidity("Kaydedilemedi, tekrar dene."); $("ig-input").reportValidity(); }
  });
  $("ig-input").addEventListener("input", () => $("ig-input").setCustomValidity(""));

  /* ---------- gündem / duyurular ---------- */
  const ANN_KEY = "gorev-sicili-duyurular";
  const AYLAR = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
  const GUNLER = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
  const parseDay = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
  const daysUntil = (s) => { const d = parseDay(s); if (!d) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 864e5); };
  const rel = (n) => n === 0 ? "Bugün" : n === 1 ? "Yarın" : n === -1 ? "Dün" : n > 1 ? `${n} gün sonra` : `${-n} gün önce`;
  const ANN_EXAMPLES = [
    { id: "ornek-duyuru-1", example: true, title: "Aylık değerlendirme toplantısı", date: addDays(2), time: "14:00", text: "Tüm ekip toplantı salonunda. Görev yeri değişiklikleri konuşulacak.", important: true },
    { id: "ornek-duyuru-2", example: true, title: "Yeni atamalar açıklanıyor", date: addDays(7), time: "", text: "Bu dönemin atama listesi duyurulacak; listeyi Instagram hesabımızdan da paylaşacağız.", important: false }
  ];
  let anns = [], editingAnn = null, showPast = false;

  function annLsWrite() { try { localStorage.setItem(ANN_KEY, JSON.stringify(anns)); } catch (e) {} }
  async function saveAnn(a) {
    if (mode === "db") { const body = JSON.parse(JSON.stringify(a)); delete body.id; await db.collection("announcements").doc(a.id).set(body); }
    else { const i = anns.findIndex((x) => x.id === a.id); if (i >= 0) anns[i] = a; else anns.push(a); annLsWrite(); renderAnns(); }
  }
  async function removeAnn(id) {
    if (mode === "db") await db.collection("announcements").doc(id).delete();
    else { anns = anns.filter((x) => x.id !== id); annLsWrite(); renderAnns(); }
  }
  function annCard(a) {
    const n = daysUntil(a.date), d = parseDay(a.date);
    const cls = "ann" + (n === 0 ? " is-today" : "") + (n !== null && n < 0 ? " is-past" : "");
    return `<button class="${cls}" type="button" data-ann="${esc(a.id)}">
      <span class="ann-date">${d ? `<b>${d.getDate()}</b><span>${AYLAR[d.getMonth()]}</span>` : "<b>?</b>"}</span>
      <span class="ann-body">
        <span class="ann-top">${n !== null ? `<span class="when-pill">${rel(n)}</span>` : ""}${a.important ? '<span class="imp-pill">Önemli</span>' : ""}${a.example ? '<span class="ex-pill">Örnek</span>' : ""}</span>
        <span class="ann-title">${esc(a.title)}</span>
        <span class="ann-meta">${d ? GUNLER[d.getDay()] : ""}${a.time ? " · saat " + esc(a.time) : ""}</span>
        ${a.text ? `<span class="ann-text">${esc(a.text)}</span>` : ""}
      </span></button>`;
  }
  function renderAnns() {
    const sorted = [...anns].sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.time || "").localeCompare(b.time || ""));
    const up = sorted.filter((a) => (daysUntil(a.date) ?? 0) >= 0);
    const past = sorted.filter((a) => (daysUntil(a.date) ?? 0) < 0).reverse();
    $("ann-count").textContent = up.length ? `${up.length} yaklaşan duyuru` : "";
    $("ann-list").innerHTML = up.length ? up.map(annCard).join("")
      : `<div class="ann-empty">Önümüzdeki günler için duyuru yok. <b>+ Duyuru ekle</b> ile ilkini yaz.</div>`;
    $("ann-past-btn").hidden = !past.length;
    $("ann-past-btn").textContent = showPast ? "Geçmiş duyuruları gizle" : `Geçmiş duyurular (${past.length})`;
    $("ann-past").hidden = !showPast || !past.length;
    $("ann-past").innerHTML = showPast ? past.map(annCard).join("") : "";
  }
  function openAnn(a) {
    editingAnn = a || null;
    $("aform-title").textContent = a ? "Duyuruyu düzenle" : "Yeni duyuru";
    $("a-title").value = a?.title || ""; $("a-date").value = a?.date || addDays(1); $("a-time").value = a?.time || "";
    $("a-text").value = a?.text || ""; $("a-imp").checked = !!a?.important;
    $("a-err").hidden = true;
    const del = $("a-del"); del.hidden = !a; del.classList.remove("sure"); del.textContent = "Sil"; del.disabled = false;
    $("a-save").textContent = a ? "Kaydet" : "Yayınla";
    $("adlg").showModal(); $("a-title").focus();
  }
  $("ann-add").onclick = () => openAnn(null);
  $("a-x").onclick = () => $("adlg").close();
  $("a-cancel").onclick = () => $("adlg").close();
  $("ann-past-btn").onclick = () => { showPast = !showPast; renderAnns(); };
  const annClick = (e) => { const b = e.target.closest("[data-ann]"); if (b) openAnn(anns.find((x) => x.id === b.dataset.ann)); };
  $("ann-list").addEventListener("click", annClick);
  $("ann-past").addEventListener("click", annClick);
  $("a-del").onclick = async () => {
    const del = $("a-del");
    if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "Emin misin? Sil"; return; }
    del.disabled = true;
    try { await removeAnn(editingAnn.id); $("adlg").close(); } catch (e) { del.disabled = false; del.textContent = "Silinemedi"; }
  };
  $("aform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = $("a-title").value.trim(), date = $("a-date").value;
    if (!title || !parseDay(date)) { $("a-err").textContent = !title ? "Başlık boş olamaz." : "Bir tarih seç."; $("a-err").hidden = false; return; }
    const a = { id: editingAnn ? editingAnn.id : "d" + newId().slice(1), title, date, time: $("a-time").value, text: $("a-text").value.trim(), important: $("a-imp").checked, updatedAt: new Date().toISOString() };
    const btn = $("a-save"); btn.disabled = true;
    try { await saveAnn(a); $("adlg").close(); renderAnns(); }
    catch (err) { $("a-err").textContent = err && err.code === "invalid_argument" ? "Bu sayfaya duyuru ekleme iznin yok." : "Kaydedilemedi, tekrar dene."; $("a-err").hidden = false; }
    finally { btn.disabled = false; }
  });

  function startLocal(note) {
    mode = "local";
    try { const t = localStorage.getItem(ANN_KEY); anns = t ? JSON.parse(t) : null; } catch (e) { anns = null; }
    if (!anns) { anns = ANN_EXAMPLES.map((a) => ({ ...a })); annLsWrite(); }
    renderAnns();
    try { siteIg = localStorage.getItem(IG_KEY) || ""; } catch (e) { siteIg = ""; }
    renderIg();
    const saved = lsRead();
    people = saved || EXAMPLES.map((p) => ({ ...p }));
    if (!saved) lsWrite();
    $("notice").textContent = note || "Kayıtlar bu cihazda, tarayıcıda saklanıyor.";
    render();
  }
  async function startDb() {
    $("notice").textContent = "Kayıtlar yükleniyor…";
    let ns = null;
    try { ns = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { ns = null; }
    if (!ns) { startLocal(); return; }
    db = ns; mode = "db";
    db.doc("settings/site").onSnapshot((d) => { siteIg = (d.exists && d.data().instagram) || ""; renderIg(); }, () => {});
    db.collection("announcements").onSnapshot((snap) => { anns = snap.docs.map((d) => ({ id: d.id, ...d.data() })); renderAnns(); }, () => {});
    const timer = setTimeout(() => { $("notice").textContent = "Kayıtlara henüz ulaşılamadı, bağlantı bekleniyor…"; }, 10000);
    db.collection("people").onSnapshot((snap) => {
      people = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { clearTimeout(timer); $("notice").textContent = "Kayıtlar bu sayfada saklanıyor; sayfayı açan herkes görür."; }
      render();
    }, (err) => { clearTimeout(timer); $("notice").textContent = "Kayıtlar okunamadı (" + err.code + ")."; });
  }

  /* ---------- görünüm ---------- */
  const sortedPeople = () => [...people].sort((a, b) => (a.name || "").localeCompare(b.name || "", "tr"));
  function matches(p) {
    if (filter !== "all" && p.status !== filter) return false;
    if (!query) return true;
    const hay = [p.name, p.desc, p.home, p.now, p.story, p.instagram, ...(p.duties || []).flatMap((d) => [d.place, d.role, d.note])].join(" ").toLocaleLowerCase("tr");
    return hay.includes(query);
  }
  const lastDuty = (p) => { const d = p.duties || []; return d[d.length - 1]; };
  function avatarHtml(p, big) {
    const cls = "avatar" + (big ? " big" : "");
    return p.photo ? `<img class="${cls}" src="${esc(p.photo)}" alt="">`
      : `<span class="${cls}" style="--hue-grad:${grad(p.name)}" aria-hidden="true">${esc(initials(p.name))}</span>`;
  }

  function render() {
    const all = sortedPeople();
    $("st-people").textContent = all.length;
    $("st-duties").textContent = all.reduce((n, p) => n + (p.duties || []).length, 0);
    $("st-places").textContent = new Set(all.flatMap((p) => (p.duties || []).map((d) => (d.place || "").trim().toLocaleLowerCase("tr")).filter(Boolean))).size;

    const counts = {}; all.forEach((p) => { counts[p.status] = (counts[p.status] || 0) + 1; });
    $("chips").innerHTML = [["all", "Hepsi", all.length], ...Object.keys(STATUS).filter((k) => counts[k]).map((k) => [k, STATUS[k], counts[k]])]
      .map(([k, label, n]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${filter === k}">${esc(label)}<i>${n}</i></button>`).join("");

    const shown = all.filter(matches);
    if (!shown.find((p) => p.id === selectedId)) selectedId = shown[0] ? shown[0].id : null;
    $("list").innerHTML = shown.length ? shown.map((p) => {
      const d = lastDuty(p);
      const sub = p.now || (d ? `${d.role || ""}${d.place ? " · " + d.place : ""}` : p.desc || "");
      return `<button class="row" type="button" data-id="${esc(p.id)}" aria-current="${p.id === selectedId}">
        ${avatarHtml(p)}<span class="who"><span class="name">${esc(p.name)}</span><span class="sub">${esc(sub)}</span></span>
        <span class="dot s-${esc(p.status)}" title="${esc(STATUS[p.status] || "")}"></span></button>`;
    }).join("") : `<p class="notice">${people.length ? "Aramaya uyan kimse yok." : "Henüz kimse eklenmedi."}</p>`;

    renderDetail(people.find((p) => p.id === selectedId));
  }

  function renderDetail(p) {
    const el = $("detail");
    if (!p) {
      el.className = "profile";
      el.innerHTML = `<div class="empty"><div class="ill">${I.folder}</div><h2>Henüz dosya yok</h2><p>İlk kişiyi eklemek için <b>Kişi ekle</b>'ye dokun. Tanımını, görev yerlerini ve sonunda ne olduğunu yaz.</p></div>`;
      return;
    }
    el.className = "profile";
    const duties = p.duties || [];
    const ig = igHandle(p.instagram);
    const chips = [
      p.born && `<span class="mchip">${I.cake}${esc(p.born)}</span>`,
      p.home && `<span class="mchip">${I.home}${esc(p.home)}</span>`,
      ig && `<span class="mchip">${I.ig}${igLink(ig)}</span>`
    ].filter(Boolean).join("");
    const live = (i, d) => i === duties.length - 1 && !d.end && (p.status === "gorevde" || p.status === "terfi");
    el.innerHTML = `
      <div class="cover" style="--hue-grad:${grad(p.name)}">${p.example ? '<span class="tag-sample">Örnek kayıt</span>' : ""}</div>
      <div class="p-head">
        ${avatarHtml(p, true)}
        <div class="actions">
          <button class="btn small" type="button" id="edit-btn">${I.edit}Düzenle</button>
          <button class="btn small danger" type="button" id="del-btn">Sil</button>
        </div>
      </div>
      <div class="p-id">
        <h2>${esc(p.name)}</h2>
        ${p.now ? `<div class="now">${esc(p.now)}</div>` : ""}
        ${chips ? `<div class="meta-chips">${chips}</div>` : ""}
      </div>
      ${p.desc ? `<p class="about">${esc(p.desc)}</p>` : ""}
      <section class="block">
        <div class="block-title"><h3>Görev yolculuğu</h3><small>${duties.length ? duties.length + " durak" : ""}</small></div>
        ${duties.length ? `<ol class="journey">${duties.map((d, i) => {
          const cur = live(i, d);
          const when = d.start || d.end ? `${esc(d.start || "?")} – ${d.end ? esc(d.end) : '<span class="live">bugün</span>'}` : "";
          return `<li class="stop${cur ? " current" : ""}">
            <span class="num">${String(i + 1).padStart(2, "0")}</span>
            <div class="card">
              <div class="top"><span class="duty">${esc(d.role || "Görev")}</span>${when ? `<span class="when">${when}</span>` : ""}</div>
              ${d.place ? `<div class="place">${I.pin}${esc(d.place)}</div>` : ""}
              ${d.note ? `<p class="note">${esc(d.note)}</p>` : ""}
            </div></li>`; }).join("")}</ol>` : `<p class="notice">Görev yeri eklenmemiş.</p>`}
      </section>
      <div class="today st-${esc(p.status || "diger")}">
        <div class="lbl"><span class="dot"></span>Ne oldu · ${esc(STATUS[p.status] || "Diğer")}</div>
        ${p.now ? `<div class="big">${esc(p.now)}</div>` : ""}
        ${p.story ? `<p>${esc(p.story)}</p>` : (!p.now ? `<p class="muted">Ne olduğu henüz yazılmamış.</p>` : "")}
      </div>`;
    $("edit-btn").onclick = () => openForm(p);
    const del = $("del-btn");
    del.onclick = async () => {
      if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "Emin misin? Sil"; setTimeout(() => { if (del.isConnected) { del.classList.remove("sure"); del.textContent = "Sil"; } }, 4000); return; }
      del.disabled = true;
      try { await removePerson(p.id); } catch (e) { del.disabled = false; del.textContent = "Silinemedi"; }
    };
  }

  /* ---------- form ---------- */
  function dutyRow(d = {}) {
    const wrap = document.createElement("div");
    wrap.className = "duty-row";
    wrap.innerHTML = `
      <div class="bar"><span>Görev</span><button class="btn small ghost" type="button" data-rm>Kaldır</button></div>
      <div class="fields">
        <label class="f">Görev yeri<input data-k="place" placeholder="örn. Kars Devlet Hastanesi" value="${esc(d.place)}"></label>
        <label class="f">Görevi / unvanı<input data-k="role" placeholder="örn. Başhekim" value="${esc(d.role)}"></label>
        <label class="f">Başlangıç<input data-k="start" placeholder="örn. 2015" value="${esc(d.start)}"></label>
        <label class="f">Bitiş<input data-k="end" placeholder="boş = hâlâ orada" value="${esc(d.end)}"></label>
        <label class="f full">Orada ne oldu?<textarea data-k="note" placeholder="Önemli olaylar, başarılar…">${esc(d.note)}</textarea></label>
      </div>`;
    wrap.querySelector("[data-rm]").onclick = () => wrap.remove();
    return wrap;
  }
  function setPhotoPreview() {
    const prev = $("f-photo-prev");
    prev.style.setProperty("--hue-grad", grad($("f-name").value));
    prev.innerHTML = photoData ? `<img src="${esc(photoData)}" alt="" style="width:100%;height:100%;object-fit:cover">` : esc(initials($("f-name").value));
  }
  function openForm(p) {
    editing = p || null;
    $("form-title").textContent = p ? "Kişiyi düzenle" : "Yeni kişi";
    $("f-name").value = p?.name || ""; $("f-born").value = p?.born || ""; $("f-home").value = p?.home || "";
    $("f-desc").value = p?.desc || ""; $("f-ig").value = p?.instagram ? "@" + p.instagram : "";
    $("f-status").value = p?.status || "gorevde"; $("f-now").value = p?.now || ""; $("f-story").value = p?.story || "";
    photoData = p?.photo || "";
    const box = $("f-duties"); box.innerHTML = "";
    (p?.duties?.length ? p.duties : [{}]).forEach((d) => box.appendChild(dutyRow(d)));
    $("f-err").hidden = true;
    setPhotoPreview();
    $("dlg").showModal();
    $("f-name").focus();
  }

  $("f-add-duty").onclick = () => { const r = dutyRow(); $("f-duties").appendChild(r); r.querySelector("input").focus(); };
  $("f-cancel").onclick = () => $("dlg").close();
  $("f-x").onclick = () => $("dlg").close();
  $("f-name").addEventListener("input", setPhotoPreview);
  $("f-photo-clear").onclick = () => { photoData = ""; setPhotoPreview(); };
  $("f-photo").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 260, c = document.createElement("canvas"); c.width = c.height = S;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S, S);
      photoData = c.toDataURL("image/jpeg", 0.82); URL.revokeObjectURL(url); setPhotoPreview();
    };
    img.onerror = () => { $("f-err").textContent = "Bu fotoğraf açılamadı, başka bir dosya dene."; $("f-err").hidden = false; };
    img.src = url; e.target.value = "";
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("f-name").value.trim();
    if (!name) { $("f-err").textContent = "Ad Soyad boş olamaz."; $("f-err").hidden = false; $("f-name").focus(); return; }
    const igRaw = $("f-ig").value.trim();
    if (igRaw && !igHandle(igRaw)) { $("f-err").textContent = "Instagram kullanıcı adı geçersiz (harf, rakam, nokta, alt çizgi olabilir)."; $("f-err").hidden = false; $("f-ig").focus(); return; }
    const duties = [...$("f-duties").querySelectorAll(".duty-row")].map((row) => {
      const d = {}; row.querySelectorAll("[data-k]").forEach((i) => { d[i.dataset.k] = i.value.trim(); }); return d;
    }).filter((d) => d.place || d.role || d.note);
    const p = {
      id: editing ? editing.id : newId(), name,
      born: $("f-born").value.trim(), home: $("f-home").value.trim(), desc: $("f-desc").value.trim(), instagram: igHandle(igRaw),
      photo: photoData, duties, status: $("f-status").value, now: $("f-now").value.trim(), story: $("f-story").value.trim(),
      updatedAt: new Date().toISOString()
    };
    const btn = $("f-save"); btn.disabled = true; btn.textContent = "Kaydediliyor…";
    try { await savePerson(p); selectedId = p.id; $("dlg").close(); render(); }
    catch (err) {
      $("f-err").textContent = err && err.code === "invalid_argument" ? "Bu sayfaya kayıt ekleme iznin yok." : err && err.code === "quota_exceeded" ? "Kayıt alanı doldu; bazı kişileri silip tekrar dene." : "Kaydedilemedi, tekrar dene.";
      $("f-err").hidden = false;
    } finally { btn.disabled = false; btn.textContent = "Kaydet"; }
  });

  /* ---------- olaylar ---------- */
  $("add-btn").onclick = () => openForm(null);
  $("fab").onclick = () => openForm(null);
  $("search").addEventListener("input", (e) => { query = e.target.value.trim().toLocaleLowerCase("tr"); render(); });
  $("chips").addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; render(); } });
  $("list").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]"); if (!b) return;
    selectedId = b.dataset.id; render();
    if (window.matchMedia("(max-width: 860px)").matches) $("detail").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  render();
  renderIg();
  renderAnns();
  if (window.claude && window.claude.use) startDb(); else startLocal();
})();
</script>

</body>
</html>
