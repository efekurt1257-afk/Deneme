<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Görev Sicili</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: personel dosyası — solda kişi rafı, sağda açık dosya; telefonda tek sütun */
:root {
  --paper: #eef1f3;
  --sheet: #ffffff;
  --ink: #17222c;
  --muted: #5d6b77;
  --line: #d6dde3;
  --accent: #1d5a7a;      /* dosya mavisi */
  --accent-soft: #dceaf2;
  --stamp: #a2352b;       /* mühür kırmızısı */
  --ok: #2f6b3f;  --ok-bg: #e2f0e5;
  --warn: #8a5a12; --warn-bg: #f6ead3;
  --grey-bg: #e7eaed;
  --shadow: 0 1px 2px rgba(23,34,44,.06), 0 6px 20px rgba(23,34,44,.06);
  --f-display: "Zilla Slab", "Rockwell", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161c; --sheet: #172129; --ink: #e5ecf1; --muted: #93a3b0; --line: #2a3843;
    --accent: #7db8d8; --accent-soft: #1d3442; --stamp: #e47a6d;
    --ok: #8fd19f; --ok-bg: #1d3424; --warn: #e7bb6c; --warn-bg: #3a2e17; --grey-bg: #24303a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161c; --sheet: #172129; --ink: #e5ecf1; --muted: #93a3b0; --line: #2a3843;
  --accent: #7db8d8; --accent-soft: #1d3442; --stamp: #e47a6d;
  --ok: #8fd19f; --ok-bg: #1d3424; --warn: #e7bb6c; --warn-bg: #3a2e17; --grey-bg: #24303a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Üst bant */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1.05; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 4px 0 0; color: var(--muted); }
.stats { display: flex; gap: 18px; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.stats b { display: block; font-family: var(--f-display); font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--sheet); border-radius: 8px;
  padding: 8px 14px; font-weight: 500;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--stamp); }
.btn.danger.sure { background: var(--stamp); border-color: var(--stamp); color: var(--sheet); }
.btn.small { padding: 5px 10px; font-size: .85rem; }

/* Gövde */
.grid { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 20px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

.shelf { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.search { width: 100%; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 10px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: .8rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

.list { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center;
  text-align: left; width: 100%; padding: 10px; border-radius: 10px;
  border: 1px solid transparent; background: transparent;
}
.row:hover { background: var(--sheet); }
.row[aria-current="true"] { background: var(--sheet); border-color: var(--line); box-shadow: var(--shadow); }
.row .who { min-width: 0; }
.row .name { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: .82rem; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.avatar {
  width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
  font-family: var(--f-display); font-weight: 700; font-size: 1rem; overflow: hidden;
}
.avatar.big { width: 88px; height: 88px; font-size: 2rem; border-radius: 14px; }

/* Dosya */
.file { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
.file-head { display: flex; flex-wrap: wrap; gap: 18px; padding: 22px 22px 18px; border-bottom: 1px dashed var(--line); position: relative; }
.file-head .meta { flex: 1 1 240px; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.file-head h2 { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.1; margin: 2px 0 6px; text-wrap: balance; }
.file-head .desc { margin: 0; max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: .85rem; color: var(--muted); }
.facts span b { color: var(--ink); font-weight: 500; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-self: flex-start; }

.section { padding: 18px 22px; }
.section h3 { font-family: var(--f-display); font-size: 1.15rem; margin: 0 0 12px; display: flex; align-items: baseline; gap: 8px; }
.section h3 small { font-family: var(--f-mono); font-weight: 400; font-size: .75rem; color: var(--muted); }

/* Görev zaman çizelgesi */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.timeline li { position: relative; padding: 0 0 18px 30px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before {
  content: ""; position: absolute; left: 0; top: 5px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--sheet); border: 3px solid var(--accent);
}
.timeline li.current::before { background: var(--accent); }
.when { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.duty { font-weight: 600; font-size: 1.02rem; }
.place { color: var(--accent); font-weight: 500; }
.note { margin: 4px 0 0; color: var(--ink); opacity: .9; max-width: 62ch; }

/* Sonuç kutusu */
.outcome { margin: 0 22px 22px; border: 2px solid var(--ink); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; position: relative; }
.outcome .now { font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; line-height: 1.2; }
.outcome p { margin: 0; max-width: 62ch; }
.pill { display: inline-block; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
.pill.s-gorevde { background: var(--ok-bg); color: var(--ok); }
.pill.s-terfi { background: var(--accent-soft); color: var(--accent); }
.pill.s-emekli { background: var(--warn-bg); color: var(--warn); }
.pill.s-ayrildi, .pill.s-diger { background: var(--grey-bg); color: var(--muted); }
.pill.s-vefat { background: var(--grey-bg); color: var(--ink); }
.stamp {
  position: absolute; right: 14px; top: -14px; background: var(--sheet); padding: 0 8px;
  font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; color: var(--stamp); text-transform: uppercase;
}
.sample { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .06em; color: var(--stamp); border: 1px solid var(--stamp); border-radius: 4px; padding: 0 5px; margin-left: 6px; text-transform: uppercase; vertical-align: middle; }

.empty { padding: 40px 24px; text-align: center; color: var(--muted); }
.empty h2 { font-family: var(--f-display); color: var(--ink); margin: 0 0 6px; }
.notice { font-size: .82rem; color: var(--muted); }

/* Form */
dialog { border: none; border-radius: 14px; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--sheet); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,16,22,.55); }
.form { display: flex; flex-direction: column; }
.form header { padding: 18px 20px 10px; border-bottom: 1px solid var(--line); }
.form header h2 { font-family: var(--f-display); margin: 0; }
.form .body { padding: 16px 20px; display: grid; gap: 14px; overflow-y: auto; }
.form footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
.full { grid-column: 1 / -1; }
label.f { display: grid; gap: 4px; font-size: .82rem; font-weight: 500; color: var(--muted); min-width: 0; }
label.f input, label.f select, label.f textarea {
  border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 10px; color: var(--ink); width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-family: var(--f-display); font-weight: 700; padding: 0 6px; }
.duty-row { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 10px; }
.duty-row .bar { display: flex; justify-content: space-between; align-items: center; }
.photo-pick { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.err { color: var(--stamp); font-size: .85rem; }

@media (prefers-reduced-motion: no-preference) {
  .file { animation: open .25s ease-out; }
  @keyframes open { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Görev Sicili</h1>
      <p>Kim, nerede görev aldı, sonra ne oldu.</p>
    </div>
    <div class="stats" aria-label="Özet">
      <div><b id="st-people">0</b>kişi</div>
      <div><b id="st-duties">0</b>görev</div>
      <div><b id="st-places">0</b>yer</div>
    </div>
    <button class="btn primary" id="add-btn" type="button">+ Kişi ekle</button>
  </header>

  <div class="grid">
    <aside class="shelf">
      <input class="search" id="search" type="search" placeholder="Ara: isim, görev yeri, unvan…" aria-label="Ara">
      <div class="chips" id="chips" role="group" aria-label="Duruma göre süz"></div>
      <div class="list" id="list"></div>
      <p class="notice" id="notice"></p>
    </aside>
    <main id="detail" class="file" aria-live="polite"></main>
  </div>
</div>

<dialog id="dlg">
  <form class="form" id="form" novalidate>
    <header><h2 id="form-title">Yeni kişi</h2></header>
    <div class="body">
      <fieldset>
        <legend>Kişi tanımı</legend>
        <div class="photo-pick">
          <div class="avatar big" id="f-photo-prev">?</div>
          <div style="display:grid;gap:6px">
            <label class="btn small" for="f-photo">Fotoğraf seç</label>
            <input id="f-photo" type="file" accept="image/*" hidden>
            <button class="btn small" type="button" id="f-photo-clear">Fotoğrafı kaldır</button>
          </div>
        </div>
        <div class="fields">
          <label class="f full">Ad Soyad *<input id="f-name" required autocomplete="off"></label>
          <label class="f">Doğum yılı / tarihi<input id="f-born" placeholder="örn. 1968"></label>
          <label class="f">Memleket<input id="f-home" placeholder="örn. Sivas"></label>
          <label class="f full">Kısa tanım<textarea id="f-desc" placeholder="Kim olduğu, mesleği, öne çıkan özelliği…"></textarea></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Görev yerleri</legend>
        <div id="f-duties" style="display:grid;gap:10px"></div>
        <button class="btn small" type="button" id="f-add-duty">+ Görev ekle</button>
      </fieldset>

      <fieldset>
        <legend>Ne oldu, neci oldu?</legend>
        <div class="fields">
          <label class="f">Durum
            <select id="f-status">
              <option value="gorevde">Görevde</option>
              <option value="terfi">Terfi etti</option>
              <option value="emekli">Emekli oldu</option>
              <option value="ayrildi">Ayrıldı</option>
              <option value="vefat">Vefat etti</option>
              <option value="diger">Diğer</option>
            </select>
          </label>
          <label class="f">Bugün ne / neci?<input id="f-now" placeholder="örn. İl Müdürü oldu"></label>
          <label class="f full">Hikâyesi / ne oldu?<textarea id="f-story" placeholder="Görevlerden sonra neler yaşandı…"></textarea></label>
        </div>
      </fieldset>
      <p class="err" id="f-err" hidden></p>
    </div>
    <footer>
      <button class="btn" type="button" id="f-cancel">Vazgeç</button>
      <button class="btn primary" type="submit" id="f-save">Kaydet</button>
    </footer>
  </form>
</dialog>

<script>
(function () {
  const STATUS = {
    gorevde: "Görevde", terfi: "Terfi etti", emekli: "Emekli", ayrildi: "Ayrıldı", vefat: "Vefat etti", diger: "Diğer"
  };
  const LS_KEY = "gorev-sicili-v1";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const initials = (n) => (n || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toLocaleUpperCase("tr");
  const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const EXAMPLES = [
    {
      id: "ornek-1", example: true, name: "Ayşe Demir", born: "1972", home: "Trabzon",
      desc: "Matematik öğretmeni olarak başladı, Karadeniz'deki köy okullarında yıllarca çalıştı.",
      duties: [
        { place: "Uzungöl İlkokulu, Çaykara", role: "Sınıf öğretmeni", start: "1995", end: "2001", note: "Köyde ilk bilgisayar sınıfını kurdu." },
        { place: "Of Anadolu Lisesi", role: "Matematik öğretmeni", start: "2001", end: "2012", note: "Öğrencileri iki kez bölge birincisi oldu." },
        { place: "Trabzon İl Milli Eğitim", role: "Şube müdürü", start: "2012", end: "", note: "" }
      ],
      status: "terfi", now: "İl Milli Eğitim Şube Müdürü", story: "Öğretmenlikten idareciliğe geçti; köy okullarındaki tecrübesiyle taşımalı eğitim planını hazırladı."
    },
    {
      id: "ornek-2", example: true, name: "Mehmet Kaya", born: "1958", home: "Erzurum",
      desc: "Uzun yıllar sahada çalışmış bir orman muhafaza memuru.",
      duties: [
        { place: "Sarıkamış Orman İşletmesi", role: "Orman muhafaza memuru", start: "1980", end: "1994", note: "Büyük yangında ekibini yönetti." },
        { place: "Bolu Orman Bölge Müdürlüğü", role: "Bölge şefi", start: "1994", end: "2018", note: "" }
      ],
      status: "emekli", now: "Emekli, köyünde arıcılık yapıyor", story: "2018'de emekli oldu. Şimdi gençlere doğa yürüyüşleri düzenliyor."
    },
    {
      id: "ornek-3", example: true, name: "Zeynep Arslan", born: "1990", home: "İzmir",
      desc: "Acil servis hemşiresi.",
      duties: [
        { place: "Hakkari Devlet Hastanesi", role: "Acil servis hemşiresi", start: "2013", end: "2017", note: "Zorunlu hizmetini burada tamamladı." },
        { place: "İzmir Şehir Hastanesi", role: "Sorumlu hemşire", start: "2017", end: "", note: "" }
      ],
      status: "gorevde", now: "Sorumlu hemşire", story: ""
    }
  ];

  let people = [];
  let selectedId = null;
  let filter = "all";
  let query = "";
  let db = null;          // claude db namespace, if served
  let mode = "local";
  let editing = null;     // person being edited
  let photoData = "";

  /* ---------- storage ---------- */
  function lsRead() { try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
  function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(people)); } catch (e) {} }

  async function savePerson(p) {
    if (mode === "db") {
      const body = JSON.parse(JSON.stringify(p)); delete body.id;
      await db.collection("people").doc(p.id).set(body);
    } else {
      const i = people.findIndex((x) => x.id === p.id);
      if (i >= 0) people[i] = p; else people.push(p);
      lsWrite(); render();
    }
  }
  async function removePerson(id) {
    if (mode === "db") await db.collection("people").doc(id).delete();
    else { people = people.filter((x) => x.id !== id); lsWrite(); render(); }
  }

  function startLocal(note) {
    mode = "local";
    const saved = lsRead();
    people = saved || EXAMPLES.map((p) => ({ ...p }));
    if (!saved) lsWrite();
    $("notice").textContent = note || "Kayıtlar bu cihazda, tarayıcıda saklanıyor.";
    render();
  }

  async function startDb() {
    $("notice").textContent = "Kayıtlar yükleniyor…";
    let ns = null;
    try { ns = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { ns = null; }
    if (!ns) { startLocal(); return; }
    db = ns; mode = "db";
    const timer = setTimeout(() => { $("notice").textContent = "Kayıtlara henüz ulaşılamadı, bağlantı bekleniyor…"; }, 10000);
    db.collection("people").onSnapshot((snap) => {
      people = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { clearTimeout(timer); $("notice").textContent = "Kayıtlar bu sayfada saklanıyor; sayfayı açan herkes görür."; }
      render();
    }, (err) => {
      clearTimeout(timer);
      $("notice").textContent = "Kayıtlar okunamadı (" + err.code + ").";
    });
  }

  /* ---------- render ---------- */
  function sortedPeople() { return [...people].sort((a, b) => (a.name || "").localeCompare(b.name || "", "tr")); }
  function matches(p) {
    if (filter !== "all" && p.status !== filter) return false;
    if (!query) return true;
    const hay = [p.name, p.desc, p.home, p.now, p.story, ...(p.duties || []).flatMap((d) => [d.place, d.role, d.note])].join(" ").toLocaleLowerCase("tr");
    return hay.includes(query);
  }
  function lastDuty(p) { const d = p.duties || []; return d[d.length - 1]; }
  function avatarHtml(p, big) {
    const cls = "avatar" + (big ? " big" : "");
    return p.photo ? `<img class="${cls}" src="${esc(p.photo)}" alt="">` : `<span class="${cls}" aria-hidden="true">${esc(initials(p.name))}</span>`;
  }

  function render() {
    const all = sortedPeople();
    $("st-people").textContent = all.length;
    $("st-duties").textContent = all.reduce((n, p) => n + (p.duties || []).length, 0);
    $("st-places").textContent = new Set(all.flatMap((p) => (p.duties || []).map((d) => (d.place || "").trim().toLocaleLowerCase("tr")).filter(Boolean))).size;

    const counts = {}; all.forEach((p) => { counts[p.status] = (counts[p.status] || 0) + 1; });
    $("chips").innerHTML = [["all", "Hepsi", all.length], ...Object.keys(STATUS).filter((k) => counts[k]).map((k) => [k, STATUS[k], counts[k]])]
      .map(([k, label, n]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${filter === k}">${esc(label)} · ${n}</button>`).join("");

    const shown = all.filter(matches);
    if (!shown.find((p) => p.id === selectedId)) selectedId = shown[0] ? shown[0].id : null;
    $("list").innerHTML = shown.length ? shown.map((p) => {
      const d = lastDuty(p);
      const sub = p.now || (d ? `${d.role || ""}${d.place ? " · " + d.place : ""}` : p.desc || "");
      return `<button class="row" type="button" data-id="${esc(p.id)}" aria-current="${p.id === selectedId}">
        ${avatarHtml(p)}<span class="who"><span class="name">${esc(p.name)}</span><span class="sub">${esc(sub)}</span></span></button>`;
    }).join("") : `<p class="notice">${people.length ? "Aramaya uyan kimse yok." : "Henüz kimse eklenmedi."}</p>`;

    renderDetail(people.find((p) => p.id === selectedId));
  }

  function renderDetail(p) {
    const el = $("detail");
    if (!p) {
      el.innerHTML = `<div class="empty"><h2>Dosya boş</h2><p>İlk kişiyi eklemek için <b>+ Kişi ekle</b>'ye dokun. Tanımını, görev yerlerini ve sonunda ne olduğunu yaz.</p></div>`;
      return;
    }
    const duties = p.duties || [];
    const facts = [p.born && `<span>Doğum <b>${esc(p.born)}</b></span>`, p.home && `<span>Memleket <b>${esc(p.home)}</b></span>`, duties.length && `<span><b>${duties.length}</b> görev yeri</span>`].filter(Boolean).join("");
    el.innerHTML = `
      <div class="file-head">
        ${avatarHtml(p, true)}
        <div class="meta">
          <div class="eyebrow">Kişi dosyası${p.example ? '<span class="sample">örnek</span>' : ""}</div>
          <h2>${esc(p.name)}</h2>
          ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
          ${facts ? `<div class="facts">${facts}</div>` : ""}
        </div>
        <div class="actions">
          <button class="btn small" type="button" id="edit-btn">Düzenle</button>
          <button class="btn small danger" type="button" id="del-btn">Sil</button>
        </div>
      </div>
      <section class="section">
        <h3>Görev yerleri <small>${duties.length ? "eskiden yeniye" : ""}</small></h3>
        ${duties.length ? `<ol class="timeline">${duties.map((d, i) => {
          const cur = i === duties.length - 1 && !d.end && p.status === "gorevde" || (i === duties.length - 1 && !d.end && p.status === "terfi");
          const when = [d.start, d.end || (d.start ? "…" : "")].filter(Boolean).join(" – ");
          return `<li class="${cur ? "current" : ""}">
            ${when ? `<div class="when">${esc(when)}</div>` : ""}
            <div class="duty">${esc(d.role || "Görev")}</div>
            ${d.place ? `<div class="place">${esc(d.place)}</div>` : ""}
            ${d.note ? `<p class="note">${esc(d.note)}</p>` : ""}
          </li>`; }).join("")}</ol>` : `<p class="notice">Görev yeri eklenmemiş.</p>`}
      </section>
      <div class="outcome">
        <span class="stamp">Sonuç</span>
        <div><span class="pill s-${esc(p.status || "diger")}">${esc(STATUS[p.status] || "Diğer")}</span></div>
        ${p.now ? `<div class="now">${esc(p.now)}</div>` : ""}
        ${p.story ? `<p>${esc(p.story)}</p>` : (!p.now ? `<p class="notice">Ne olduğu henüz yazılmamış.</p>` : "")}
      </div>`;
    $("edit-btn").onclick = () => openForm(p);
    const del = $("del-btn");
    del.onclick = async () => {
      if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "Emin misin? Sil"; setTimeout(() => { if (del.isConnected) { del.classList.remove("sure"); del.textContent = "Sil"; } }, 4000); return; }
      del.disabled = true;
      try { await removePerson(p.id); } catch (e) { del.disabled = false; del.textContent = "Silinemedi"; }
    };
  }

  /* ---------- form ---------- */
  function dutyRow(d = {}) {
    const wrap = document.createElement("div");
    wrap.className = "duty-row";
    wrap.innerHTML = `
      <div class="bar"><span class="eyebrow">Görev</span><button class="btn small" type="button" data-rm>Kaldır</button></div>
      <div class="fields">
        <label class="f">Görev yeri<input data-k="place" placeholder="örn. Kars Devlet Hastanesi" value="${esc(d.place)}"></label>
        <label class="f">Görevi / unvanı<input data-k="role" placeholder="örn. Başhekim" value="${esc(d.role)}"></label>
        <label class="f">Başlangıç<input data-k="start" placeholder="örn. 2015" value="${esc(d.start)}"></label>
        <label class="f">Bitiş<input data-k="end" placeholder="boş = hâlâ orada" value="${esc(d.end)}"></label>
        <label class="f full">Orada ne oldu?<textarea data-k="note" placeholder="Önemli olaylar, başarılar…">${esc(d.note)}</textarea></label>
      </div>`;
    wrap.querySelector("[data-rm]").onclick = () => wrap.remove();
    return wrap;
  }
  function setPhotoPreview() {
    const prev = $("f-photo-prev");
    prev.innerHTML = photoData ? `<img src="${esc(photoData)}" alt="" style="width:100%;height:100%;object-fit:cover">` : esc(initials($("f-name").value));
  }
  function openForm(p) {
    editing = p || null;
    $("form-title").textContent = p ? "Kişiyi düzenle" : "Yeni kişi";
    $("f-name").value = p?.name || "";
    $("f-born").value = p?.born || "";
    $("f-home").value = p?.home || "";
    $("f-desc").value = p?.desc || "";
    $("f-status").value = p?.status || "gorevde";
    $("f-now").value = p?.now || "";
    $("f-story").value = p?.story || "";
    photoData = p?.photo || "";
    const box = $("f-duties"); box.innerHTML = "";
    (p?.duties?.length ? p.duties : [{}]).forEach((d) => box.appendChild(dutyRow(d)));
    $("f-err").hidden = true;
    setPhotoPreview();
    $("dlg").showModal();
    $("f-name").focus();
  }

  $("f-add-duty").onclick = () => { const r = dutyRow(); $("f-duties").appendChild(r); r.querySelector("input").focus(); };
  $("f-cancel").onclick = () => $("dlg").close();
  $("f-name").addEventListener("input", () => { if (!photoData) setPhotoPreview(); });
  $("f-photo-clear").onclick = () => { photoData = ""; setPhotoPreview(); };
  $("f-photo").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 240, c = document.createElement("canvas"); c.width = c.height = S;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S, S);
      photoData = c.toDataURL("image/jpeg", 0.82); URL.revokeObjectURL(url); setPhotoPreview();
    };
    img.onerror = () => { $("f-err").textContent = "Bu fotoğraf açılamadı, başka bir dosya dene."; $("f-err").hidden = false; };
    img.src = url; e.target.value = "";
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("f-name").value.trim();
    if (!name) { $("f-err").textContent = "Ad Soyad boş olamaz."; $("f-err").hidden = false; $("f-name").focus(); return; }
    const duties = [...$("f-duties").querySelectorAll(".duty-row")].map((row) => {
      const d = {}; row.querySelectorAll("[data-k]").forEach((i) => { d[i.dataset.k] = i.value.trim(); }); return d;
    }).filter((d) => d.place || d.role || d.note);
    const p = {
      id: editing ? editing.id : newId(), name,
      born: $("f-born").value.trim(), home: $("f-home").value.trim(), desc: $("f-desc").value.trim(),
      photo: photoData, duties, status: $("f-status").value, now: $("f-now").value.trim(), story: $("f-story").value.trim(),
      updatedAt: new Date().toISOString()
    };
    const btn = $("f-save"); btn.disabled = true; btn.textContent = "Kaydediliyor…";
    try {
      await savePerson(p);
      selectedId = p.id; $("dlg").close(); render();
    } catch (err) {
      $("f-err").textContent = err && err.code === "invalid_argument" ? "Bu sayfaya kayıt ekleme iznin yok." : err && err.code === "quota_exceeded" ? "Kayıt alanı doldu; bazı kişileri silip tekrar dene." : "Kaydedilemedi, tekrar dene.";
      $("f-err").hidden = false;
    } finally { btn.disabled = false; btn.textContent = "Kaydet"; }
  });

  /* ---------- events ---------- */
  $("add-btn").onclick = () => openForm(null);
  $("search").addEventListener("input", (e) => { query = e.target.value.trim().toLocaleLowerCase("tr"); render(); });
  $("chips").addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; render(); } });
  $("list").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]"); if (!b) return;
    selectedId = b.dataset.id; render();
    if (window.matchMedia("(max-width: 820px)").matches) $("detail").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  render();
  if (window.claude && window.claude.use) startDb(); else startLocal();
})();
</script>

</body>
</html>
