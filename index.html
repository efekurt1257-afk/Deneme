<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Gündem Panosu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: yapışkan üst bar → özet şeridi → sekmeler (Gündem · Etkinlikler · Duyurular · Haberler) → kart listeleri; telefonda tek sütun + yüzen buton */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --surface-2: #f7f8f6;
  --ink: #121a17;
  --muted: #5f6b66;
  --line: #e1e6e2;
  --accent: #0f766e;  --accent-ink: #ffffff; --accent-soft: #d9f0ec;   /* etkinlik */
  --amber: #b45309;   --amber-soft: #fdf0dc;                           /* duyuru */
  --blue: #1d4ed8;    --blue-soft: #e0e8fd;                            /* haber */
  --grey-soft: #eceeed;
  --danger: #c2410c;
  --shadow-sm: 0 1px 2px rgba(18,26,23,.05);
  --shadow: 0 1px 2px rgba(18,26,23,.04), 0 12px 32px -12px rgba(18,26,23,.14);
  --glass: rgba(242,244,241,.78);
  --r: 18px;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b100e; --surface: #141b18; --surface-2: #19211e; --ink: #e8efec; --muted: #94a39d; --line: #26302c;
    --accent: #2dd4bf; --accent-ink: #062320; --accent-soft: #123a35;
    --amber: #fbbf24; --amber-soft: #3a2a0e; --blue: #93b4ff; --blue-soft: #1a2647; --grey-soft: #222b28; --danger: #fb923c;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 36px -14px rgba(0,0,0,.6);
    --glass: rgba(11,16,14,.75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b100e; --surface: #141b18; --surface-2: #19211e; --ink: #e8efec; --muted: #94a39d; --line: #26302c;
  --accent: #2dd4bf; --accent-ink: #062320; --accent-soft: #123a35;
  --amber: #fbbf24; --amber-soft: #3a2a0e; --blue: #93b4ff; --blue-soft: #1a2647; --grey-soft: #222b28; --danger: #fb923c;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 36px -14px rgba(0,0,0,.6);
  --glass: rgba(11,16,14,.75);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.inner { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
svg { flex: none; }

/* Üst bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.topbar .inner { display: flex; align-items: center; gap: 14px; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 10px; flex: none; }
.logo-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.logo-mark svg { width: 20px; height: 20px; }
.logo-name { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; line-height: 1; }
.logo-name small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .72rem; color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.search-wrap { flex: 1 1 auto; max-width: 440px; margin-left: auto; position: relative; min-width: 0; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px 9px 36px; outline: none; transition: border-color .15s, box-shadow .15s; }
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
@media (max-width: 680px) { .logo-name small { display: none; } .add-top { display: none !important; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 16px; font-weight: 600; font-size: .92rem; transition: transform .12s, background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.danger.sure { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { padding: 6px 12px; font-size: .84rem; border-radius: 10px; }
.btn svg { width: 16px; height: 16px; }

/* Özet şeridi */
.overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 2fr); gap: 12px; padding-block: 22px 16px; }
@media (max-width: 1000px) { .overview { grid-template-columns: repeat(4, minmax(0, 1fr)); } .ig-card { grid-column: 1 / -1; } }
@media (max-width: 560px) { .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; text-align: left; }
button.stat { cursor: pointer; transition: border-color .15s; }
button.stat:hover { border-color: var(--muted); }
.stat b { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; line-height: 1.1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); font-weight: 500; }
@media (max-width: 560px) { .stat { padding: 12px; border-radius: 14px; } .stat b { font-size: 1.5rem; } }
.ig-card { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ig-badge { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #f59e0b, #e1306c 55%, #7c3aed); }
.ig-badge svg { width: 22px; height: 22px; }
.ig-text { flex: 1 1 140px; min-width: 0; display: grid; gap: 1px; }
.ig-text .lbl { font-size: .78rem; color: var(--muted); font-weight: 500; }
.ig-text a { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; word-break: break-all; }
.ig-text a:hover { color: var(--accent); }
.ig-text .empty-ig { font-weight: 600; }
.ig-form { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; min-width: 0; }
.ig-form input { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 7px 11px; }

/* Sekmeler */
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; scrollbar-width: none; margin-bottom: 18px; width: fit-content; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: none; background: transparent; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: .9rem; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab i { font-style: normal; font-size: .74rem; font-weight: 600; opacity: .65; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .tabs { width: 100%; } .tab { flex: 1 1 0; justify-content: center; padding: 8px 4px; font-size: .84rem; } .tab i { display: none; } }

main { padding-bottom: 104px; display: grid; gap: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow-sm); min-width: 0; align-content: start; }
@media (max-width: 640px) { .panel { padding: 14px; border-radius: 20px; } }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.panel-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -.02em; margin: 0; display: flex; align-items: center; gap: 10px; }
.panel-head h2 .ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.panel-head h2 .ico svg { width: 17px; height: 17px; }
.ico.etkinlik { background: var(--accent-soft); color: var(--accent); }
.ico.duyuru { background: var(--amber-soft); color: var(--amber); }
.ico.haber { background: var(--blue-soft); color: var(--blue); }
.panel-head .muted { font-size: .85rem; }
.two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; align-items: start; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.cards.single { grid-template-columns: 1fr; }
.card { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); transition: transform .15s, box-shadow .15s, border-color .15s; min-width: 0; }
.card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.card.is-today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card.is-past { opacity: .62; }
.tile { display: grid; justify-items: center; align-content: center; height: 62px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); line-height: 1.05; }
.tile b { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tile span { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card.is-today .tile { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.card.is-today .tile span { color: inherit; opacity: .85; }
.tile.duyuru { background: var(--amber-soft); border-color: transparent; color: var(--amber); }
.tile.duyuru svg { width: 26px; height: 26px; }
.card.duyuru.is-today { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.card.duyuru.is-today .tile { background: var(--amber); color: var(--surface); }
.cb { display: grid; gap: 3px; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pills:empty { display: none; }
.pill { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.pill.when { background: var(--accent-soft); color: var(--accent); }
.duyuru .pill.when { background: var(--amber-soft); color: var(--amber); }
.pill.imp { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.pill.ex { background: var(--grey-soft); color: var(--muted); font-family: var(--f-mono); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
.ct { font-weight: 700; font-size: 1rem; line-height: 1.3; overflow-wrap: anywhere; }
.cm { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.cm svg { width: 13px; height: 13px; }
.cx { font-size: .88rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

.card.news { display: flex; flex-direction: column; padding: 0; overflow: hidden; gap: 0; }
.card.news .nimg { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; max-width: 100%; background: var(--grey-soft); }
.card.news .nph { width: 100%; height: 56px; display: flex; align-items: center; padding: 0 14px; background: var(--blue-soft); color: var(--blue); }
.card.news .nph svg { width: 24px; height: 24px; opacity: .85; }
.card.news .cb { padding: 12px 14px 14px; }
.card.news .ct { font-family: var(--f-display); font-size: 1.12rem; letter-spacing: -.01em; }

.empty-box { grid-column: 1 / -1; padding: 22px 18px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); text-align: center; }
.linkbtn { border: none; background: none; color: var(--accent); font-weight: 700; font-size: .85rem; padding: 4px 2px; }
.linkbtn:hover { text-decoration: underline; }
.past-btn { justify-self: start; }
.notice { font-size: .8rem; color: var(--muted); margin: 0; }
.muted { color: var(--muted); }

/* Bugün bandı */
.today-alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); }
.today-alert svg { width: 24px; height: 24px; margin-top: 1px; }
.today-alert b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; letter-spacing: -.01em; }
.today-alert ul { margin: 3px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .today-alert svg { animation: ring 1.6s ease-in-out 2; transform-origin: 50% 10%; }
  @keyframes ring { 0%,100% { rotate: 0deg; } 15% { rotate: 14deg; } 30% { rotate: -12deg; } 45% { rotate: 8deg; } 60% { rotate: 0deg; } }
}

/* Yüzen buton */
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 25; width: 58px; height: 58px; border-radius: 18px; border: none; background: var(--ink); color: var(--bg); box-shadow: 0 12px 28px -8px rgba(0,0,0,.45); display: none; place-items: center; }
.fab svg { width: 26px; height: 26px; }
@media (max-width: 680px) { .fab { display: grid; } }

/* Diyaloglar */
dialog { border: none; border-radius: 24px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(8,12,10,.5); backdrop-filter: blur(4px); }
@media (max-width: 600px) { dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 24px 24px 0 0; max-height: 92dvh; } }
.form { display: flex; flex-direction: column; max-height: inherit; }
.form header { padding: 18px 22px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.form header h2 { font-family: var(--f-display); font-weight: 800; letter-spacing: -.02em; margin: 0; font-size: 1.4rem; }
.form .body { padding: 4px 22px 18px; display: grid; gap: 14px; overflow-y: auto; }
.form footer { padding: 12px 22px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; }
.seg label { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 6px; border-radius: 10px; font-weight: 700; font-size: .88rem; color: var(--muted); cursor: pointer; }
.seg label svg { width: 16px; height: 16px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
.full { grid-column: 1 / -1; }
label.f { display: grid; gap: 5px; font-size: .82rem; font-weight: 600; min-width: 0; }
label.f input, label.f textarea { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; font-weight: 400; outline: none; transition: border-color .15s, box-shadow .15s; }
label.f input:focus, label.f textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
textarea { resize: vertical; min-height: 96px; }
label.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; }
label.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.img-pick { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.img-pick .prev { width: 120px; aspect-ratio: 16 / 9; border-radius: 12px; object-fit: cover; background: var(--blue-soft); max-width: 100%; }
.err { color: var(--danger); font-size: .85rem; font-weight: 600; margin: 0; }

/* Okuma görünümü */
.view-img { width: 100%; max-height: 340px; object-fit: cover; border-radius: 16px; display: block; }
.view-type { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
.view-type.etkinlik { color: var(--accent); } .view-type.duyuru { color: var(--amber); } .view-type.haber { color: var(--blue); }
.view-title { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.02em; line-height: 1.15; margin: 4px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
.view-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: .84rem; font-weight: 500; }
.mchip svg { width: 14px; height: 14px; color: var(--muted); }
.view-text { margin: 0; white-space: pre-wrap; max-width: 66ch; overflow-wrap: anywhere; }

@media (prefers-reduced-motion: no-preference) {
  main > * { animation: rise .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { transform: translateY(6px); opacity: .5; } to { transform: none; opacity: 1; } }
  dialog[open] { animation: pop .25s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>

<header class="topbar">
  <div class="inner">
    <div class="logo">
      <div class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
      <div class="logo-name">Gündem Panosu<small>Etkinlikler, duyurular ve haberler</small></div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="search" id="search" type="search" placeholder="Etkinlik, duyuru, haber ara…" aria-label="Ara">
    </div>
    <button class="btn primary add-top" id="add-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Yeni ekle
    </button>
  </div>
</header>

<div class="inner">
  <section class="overview" aria-label="Özet">
    <button class="stat" type="button" data-go="gundem"><b id="st-today">0</b><span>bugün</span></button>
    <button class="stat" type="button" data-go="etkinlikler"><b id="st-ev">0</b><span>yaklaşan etkinlik</span></button>
    <button class="stat" type="button" data-go="duyurular"><b id="st-an">0</b><span>güncel duyuru</span></button>
    <button class="stat" type="button" data-go="haberler"><b id="st-news">0</b><span>haber</span></button>
    <div class="stat ig-card" id="ig-bar">
      <div class="ig-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/></svg></div>
      <div class="ig-text" id="ig-view"></div>
      <form id="ig-form" class="ig-form" hidden>
        <input id="ig-input" placeholder="@hesabiniz ya da instagram.com/… linki" aria-label="Instagram hesabı" autocomplete="off">
        <button class="btn small primary" type="submit">Kaydet</button>
        <button class="btn small ghost" type="button" id="ig-cancel">Vazgeç</button>
      </form>
    </div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Bölümler" id="tabs">
    <button class="tab" role="tab" type="button" data-tab="gundem">Gündem</button>
    <button class="tab" role="tab" type="button" data-tab="etkinlikler">Etkinlikler <i id="tc-ev"></i></button>
    <button class="tab" role="tab" type="button" data-tab="duyurular">Duyurular <i id="tc-an"></i></button>
    <button class="tab" role="tab" type="button" data-tab="haberler">Haberler <i id="tc-news"></i></button>
  </nav>

  <main id="main" aria-live="polite"></main>
  <p class="notice" id="notice" style="padding-bottom:96px;margin-top:-80px"></p>
</div>

<button class="fab" id="fab" type="button" aria-label="Yeni ekle">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Ekle / düzenle -->
<dialog id="edlg">
  <form class="form" id="eform" novalidate>
    <header>
      <h2 id="e-title-h">Yeni ekle</h2>
      <button class="btn small ghost" type="button" data-close aria-label="Kapat">✕</button>
    </header>
    <div class="body">
      <div class="seg" role="radiogroup" aria-label="Tür" id="e-type">
        <label><input type="radio" name="e-type" value="etkinlik" id="e-type-etkinlik"><span class="t-ico" data-icon="etkinlik"></span>Etkinlik</label>
        <label><input type="radio" name="e-type" value="duyuru" id="e-type-duyuru"><span class="t-ico" data-icon="duyuru"></span>Duyuru</label>
        <label><input type="radio" name="e-type" value="haber" id="e-type-haber"><span class="t-ico" data-icon="haber"></span>Haber</label>
      </div>
      <div class="fields">
        <label class="f full">Başlık *<input id="e-title" autocomplete="off" placeholder="örn. Cuma akşamı buluşma"></label>
        <label class="f" id="e-date-l"><span id="e-date-lbl">Tarih *</span><input id="e-date" type="date"></label>
        <label class="f" data-for="etkinlik duyuru">Saat<input id="e-time" type="time"></label>
        <label class="f" data-for="etkinlik">Bitiş saati<input id="e-end" type="time"></label>
        <label class="f" data-for="etkinlik">Yer<input id="e-place" autocomplete="off" placeholder="örn. Kültür merkezi"></label>
        <div class="f full img-pick" data-for="haber">
          <img class="prev" id="e-img-prev" alt="" hidden>
          <label class="btn small" for="e-img">Fotoğraf ekle</label>
          <input id="e-img" type="file" accept="image/*" hidden>
          <button class="btn small ghost" type="button" id="e-img-clear" hidden>Kaldır</button>
        </div>
        <label class="f full"><span id="e-text-lbl">Açıklama</span><textarea id="e-text" placeholder="Ayrıntılar…"></textarea></label>
        <label class="check full" data-for="etkinlik duyuru"><input id="e-imp" type="checkbox"> Önemli olarak işaretle</label>
      </div>
      <p class="err" id="e-err" hidden></p>
    </div>
    <footer>
      <span style="flex:1"></span>
      <button class="btn ghost" type="button" data-close>Vazgeç</button>
      <button class="btn primary" type="submit" id="e-save">Yayınla</button>
    </footer>
  </form>
</dialog>

<!-- Okuma görünümü -->
<dialog id="vdlg">
  <div class="form">
    <header>
      <span class="view-type" id="v-type"></span>
      <button class="btn small ghost" type="button" data-close aria-label="Kapat">✕</button>
    </header>
    <div class="body" id="v-body"></div>
    <footer>
      <button class="btn danger" type="button" id="v-del">Sil</button>
      <span style="flex:1"></span>
      <button class="btn" type="button" id="v-edit">Düzenle</button>
    </footer>
  </div>
</dialog>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const newId = () => "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const LS_KEY = "gundem-panosu-v1", IG_KEY = "gorev-sicili-instagram";

  const I = {
    etkinlik: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    duyuru: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11"/></svg>',
    haber: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5M8 17h3"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/></svg>',
    bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>'
  };
  document.querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = I[el.dataset.icon]; });

  const TYPES = { etkinlik: "Etkinlik", duyuru: "Duyuru", haber: "Haber" };
  const TAB_TYPE = { etkinlikler: "etkinlik", duyurular: "duyuru", haberler: "haber" };

  /* ---------- tarih yardımcıları ---------- */
  const AYLAR = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
  const AYLAR_UZUN = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const GUNLER = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
  const parseDay = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
  const daysUntil = (s) => { const d = parseDay(s); if (!d) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 864e5); };
  const rel = (n) => n === 0 ? "Bugün" : n === 1 ? "Yarın" : n === -1 ? "Dün" : n > 1 ? `${n} gün sonra` : `${-n} gün önce`;
  const longDate = (s) => { const d = parseDay(s); return d ? `${d.getDate()} ${AYLAR_UZUN[d.getMonth()]} ${d.getFullYear()}, ${GUNLER[d.getDay()]}` : ""; };
  const shortDate = (s) => { const d = parseDay(s); return d ? `${d.getDate()} ${AYLAR_UZUN[d.getMonth()]} ${GUNLER[d.getDay()]}` : ""; };

  const EXAMPLES = [
    { id: "ornek-etkinlik-1", example: true, type: "etkinlik", title: "Aylık değerlendirme toplantısı", date: addDays(2), time: "14:00", endTime: "16:00", place: "Toplantı salonu", text: "Ayın etkinliklerini ve önümüzdeki planları konuşacağız. Herkes davetli.", important: true },
    { id: "ornek-etkinlik-2", example: true, type: "etkinlik", title: "Kış şenliği hazırlık buluşması", date: addDays(9), time: "19:30", endTime: "", place: "Kültür merkezi", text: "Görev dağılımı yapılacak, gönüllüler bekleniyor.", important: false },
    { id: "ornek-duyuru-3", example: true, type: "duyuru", title: "Yeni dönem kayıtları başladı", date: addDays(1), time: "", text: "Kayıtlar ay sonuna kadar açık. Ayrıntılar için Instagram hesabımızı takip edin.", important: false },
    { id: "ornek-haber-1", example: true, type: "haber", title: "Instagram hesabımız açıldı", date: addDays(-1), text: "Etkinlik fotoğraflarını ve duyuruları artık Instagram hesabımızdan da paylaşıyoruz." },
    { id: "ornek-haber-2", example: true, type: "haber", title: "Geçen haftaki buluşmaya yoğun katılım", date: addDays(-4), text: "Kırktan fazla kişinin katıldığı buluşmada yılın etkinlik takvimi konuşuldu." }
  ];

  let items = [], tab = "gundem", query = "", showPast = { etkinlik: false, duyuru: false };
  let db = null, mode = "local", editing = null, viewing = null, imgData = "", siteIg = "";
  const typeOf = (a) => TYPES[a.type] ? a.type : "duyuru";

  /* ---------- kayıt ---------- */
  function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch (e) {} }
  async function saveItem(a) {
    if (mode === "db") { const body = JSON.parse(JSON.stringify(a)); delete body.id; await db.collection("announcements").doc(a.id).set(body); }
    else { const i = items.findIndex((x) => x.id === a.id); if (i >= 0) items[i] = a; else items.push(a); lsWrite(); render(); }
  }
  async function removeItem(id) {
    if (mode === "db") await db.collection("announcements").doc(id).delete();
    else { items = items.filter((x) => x.id !== id); lsWrite(); render(); }
  }

  /* ---------- Instagram ---------- */
  const igHandle = (s) => {
    let t = String(s || "").trim();
    const m = t.match(/instagram\.com\/([^/?#\s]+)/i);
    if (m) t = m[1];
    t = t.replace(/^@+/, "").replace(/\/+$/, "");
    return /^[A-Za-z0-9._]{1,30}$/.test(t) ? t : "";
  };
  const igLink = (h) => `<a href="https://www.instagram.com/${encodeURIComponent(h)}/" target="_blank" rel="noopener">@${esc(h)}</a>`;
  function renderIg() {
    $("ig-view").innerHTML = `<span class="lbl">Instagram hesabımız</span>` + (siteIg ? `<span>${igLink(siteIg)}</span>` : `<span class="empty-ig">Henüz eklenmedi</span>`);
    let b = $("ig-edit");
    if (!b) { b = document.createElement("button"); b.id = "ig-edit"; b.type = "button"; b.className = "btn small"; $("ig-bar").insertBefore(b, $("ig-form")); }
    b.textContent = siteIg ? "Değiştir" : "Instagram ekle";
    b.onclick = () => { $("ig-view").hidden = true; b.hidden = true; $("ig-form").hidden = false; $("ig-input").value = siteIg ? "@" + siteIg : ""; $("ig-input").focus(); };
  }
  function closeIgForm() { $("ig-form").hidden = true; $("ig-view").hidden = false; if ($("ig-edit")) $("ig-edit").hidden = false; }
  $("ig-cancel").onclick = closeIgForm;
  $("ig-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const raw = $("ig-input").value.trim(), h = igHandle(raw);
    if (raw && !h) { $("ig-input").setCustomValidity("Geçerli bir Instagram kullanıcı adı yaz (harf, rakam, nokta, alt çizgi)."); $("ig-input").reportValidity(); return; }
    $("ig-input").setCustomValidity("");
    try {
      if (mode === "db") await db.doc("settings/site").set({ instagram: h });
      else { try { localStorage.setItem(IG_KEY, h); } catch (err) {} }
      siteIg = h; closeIgForm(); renderIg();
    } catch (err) { $("ig-input").setCustomValidity("Kaydedilemedi, tekrar dene."); $("ig-input").reportValidity(); }
  });
  $("ig-input").addEventListener("input", () => $("ig-input").setCustomValidity(""));

  /* ---------- kartlar ---------- */
  function pills(a) {
    const t = typeOf(a), n = daysUntil(a.date);
    let s = "";
    if (t !== "haber" && n !== null && n >= -1) s += `<span class="pill when">${rel(n)}</span>`;
    if (t !== "haber" && a.important) s += `<span class="pill imp">Önemli</span>`;
    if (a.example) s += `<span class="pill ex">Örnek</span>`;
    return s;
  }
  function card(a) {
    const t = typeOf(a), d = parseDay(a.date), n = daysUntil(a.date);
    const state = (t !== "haber" && n === 0 ? " is-today" : "") + (t !== "haber" && n !== null && n < 0 ? " is-past" : "");
    if (t === "haber") {
      return `<button class="card news" type="button" data-id="${esc(a.id)}">
        ${a.image ? `<img class="nimg" src="${esc(a.image)}" alt="">` : `<span class="nph">${I.haber}</span>`}
        <span class="cb"><span class="pills">${pills(a)}</span><span class="cm">${esc(shortDate(a.date))}</span><span class="ct">${esc(a.title)}</span>${a.text ? `<span class="cx">${esc(a.text)}</span>` : ""}</span></button>`;
    }
    const tile = t === "etkinlik"
      ? `<span class="tile">${d ? `<b>${d.getDate()}</b><span>${AYLAR[d.getMonth()]}</span>` : "<b>?</b>"}</span>`
      : `<span class="tile duyuru">${I.duyuru}</span>`;
    const time = a.time ? esc(a.time) + (a.endTime ? "–" + esc(a.endTime) : "") : "";
    const meta = t === "etkinlik"
      ? `${d ? GUNLER[d.getDay()] : ""}${time ? ` · ${I.clock}${time}` : ""}`
      : `${I.cal}${esc(shortDate(a.date))}${time ? ` · ${I.clock}${time}` : ""}`;
    return `<button class="card ${t}${state}" type="button" data-id="${esc(a.id)}">${tile}
      <span class="cb"><span class="pills">${pills(a)}</span><span class="ct">${esc(a.title)}</span>
      <span class="cm">${meta}</span>${a.place ? `<span class="cm">${I.pin}${esc(a.place)}</span>` : ""}
      ${a.text ? `<span class="cx">${esc(a.text)}</span>` : ""}</span></button>`;
  }

  /* ---------- görünümler ---------- */
  const matches = (a) => !query || [a.title, a.text, a.place].join(" ").toLocaleLowerCase("tr").includes(query);
  const byAsc = (a, b) => (a.date || "").localeCompare(b.date || "") || (a.time || "").localeCompare(b.time || "");
  const ofType = (t) => items.filter((a) => typeOf(a) === t && matches(a));
  const upcoming = (t) => ofType(t).filter((a) => (daysUntil(a.date) ?? 0) >= 0).sort(byAsc);
  const past = (t) => ofType(t).filter((a) => (daysUntil(a.date) ?? 0) < 0).sort(byAsc).reverse();
  const news = () => ofType("haber").sort(byAsc).reverse();

  function panel(t, title, sub, body, extra = "") {
    return `<section class="panel"><div class="panel-head"><h2><span class="ico ${t}">${I[t]}</span>${title}</h2>${sub}</div>${body}${extra}</section>`;
  }
  const emptyBox = (txt) => `<div class="empty-box">${txt}</div>`;
  const seeAll = (tabName, label) => `<button class="linkbtn" type="button" data-go="${tabName}">${label} →</button>`;

  function todayBanner() {
    const todays = items.filter((a) => typeOf(a) !== "haber" && daysUntil(a.date) === 0).sort(byAsc);
    if (!todays.length) return "";
    return `<div class="today-alert" role="status">${I.bell}<div><b>Bugün ${todays.length} etkinlik/duyuru var</b><ul>${todays.map((a) => `<li>${a.time ? esc(a.time) + " · " : ""}${esc(a.title)} <span style="opacity:.75">(${TYPES[typeOf(a)]})</span></li>`).join("")}</ul></div></div>`;
  }

  function listPanel(t) {
    const up = upcoming(t), ps = past(t), label = t === "etkinlik" ? "etkinlik" : "duyuru";
    const body = `<div class="cards">${up.length ? up.map(card).join("") : emptyBox(query ? "Aramaya uyan kayıt yok." : `Önümüzdeki günler için ${label} yok. <b>Yeni ekle</b> ile ilkini yaz.`)}</div>`;
    const pastBtn = ps.length ? `<button class="btn small ghost past-btn" type="button" data-past="${t}">${showPast[t] ? "Geçmişi gizle" : `Geçmiş ${t === "etkinlik" ? "etkinlikler" : "duyurular"} (${ps.length})`}</button>` : "";
    const pastList = ps.length && showPast[t] ? `<div class="cards">${ps.map(card).join("")}</div>` : "";
    return panel(t, t === "etkinlik" ? "Etkinlikler" : "Duyurular", `<span class="muted">${up.length ? up.length + " yaklaşan" : ""}</span>`, body, pastBtn + pastList);
  }
  function newsPanel(limit) {
    const all = news(), list = limit ? all.slice(0, limit) : all;
    const body = `<div class="cards">${list.length ? list.map(card).join("") : emptyBox(query ? "Aramaya uyan haber yok." : "Henüz haber yok. <b>Yeni ekle</b>'den Haber seçip ilkini yaz.")}</div>`;
    return panel("haber", limit ? "Son haberler" : "Haberler", limit && all.length > limit ? seeAll("haberler", "Tüm haberler") : `<span class="muted">${all.length ? all.length + " haber" : ""}</span>`, body);
  }

  function render() {
    const evUp = items.filter((a) => typeOf(a) === "etkinlik" && (daysUntil(a.date) ?? 0) >= 0).length;
    const anUp = items.filter((a) => typeOf(a) === "duyuru" && (daysUntil(a.date) ?? 0) >= 0).length;
    const newsN = items.filter((a) => typeOf(a) === "haber").length;
    $("st-today").textContent = items.filter((a) => typeOf(a) !== "haber" && daysUntil(a.date) === 0).length;
    $("st-ev").textContent = evUp; $("st-an").textContent = anUp; $("st-news").textContent = newsN;
    $("tc-ev").textContent = evUp || ""; $("tc-an").textContent = anUp || ""; $("tc-news").textContent = newsN || "";
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));

    let html = "";
    if (tab === "gundem") {
      const ev = upcoming("etkinlik"), an = upcoming("duyuru");
      html = todayBanner() + `<div class="two">` +
        panel("etkinlik", "Yaklaşan etkinlikler", ev.length > 4 ? seeAll("etkinlikler", "Tümü") : "",
          `<div class="cards single">${ev.length ? ev.slice(0, 4).map(card).join("") : emptyBox(query ? "Aramaya uyan etkinlik yok." : "Yaklaşan etkinlik yok.")}</div>`) +
        panel("duyuru", "Duyurular", an.length > 4 ? seeAll("duyurular", "Tümü") : "",
          `<div class="cards single">${an.length ? an.slice(0, 4).map(card).join("") : emptyBox(query ? "Aramaya uyan duyuru yok." : "Güncel duyuru yok.")}</div>`) +
        `</div>` + newsPanel(3);
    } else if (tab === "etkinlikler") html = todayBanner() + listPanel("etkinlik");
    else if (tab === "duyurular") html = listPanel("duyuru");
    else html = newsPanel(0);
    $("main").innerHTML = html;
  }

  function setTab(t) {
    if (!["gundem", "etkinlikler", "duyurular", "haberler"].includes(t)) t = "gundem";
    tab = t;
    if (location.hash.slice(1) !== t) { try { history.replaceState(null, "", "#" + t); } catch (e) {} }
    render();
  }

  /* ---------- okuma görünümü ---------- */
  function openView(a) {
    viewing = a;
    const t = typeOf(a);
    $("v-type").className = "view-type " + t;
    $("v-type").innerHTML = I[t] + TYPES[t];
    const time = a.time ? esc(a.time) + (a.endTime ? " – " + esc(a.endTime) : "") : "";
    const n = daysUntil(a.date);
    $("v-body").innerHTML = `
      ${a.image ? `<img class="view-img" src="${esc(a.image)}" alt="">` : ""}
      <div><div class="pills">${pills(a)}</div><h2 class="view-title">${esc(a.title)}</h2></div>
      <div class="view-meta">
        ${a.date ? `<span class="mchip">${I.cal}${esc(longDate(a.date))}${t !== "haber" && n !== null ? ` · ${rel(n)}` : ""}</span>` : ""}
        ${time ? `<span class="mchip">${I.clock}${time}</span>` : ""}
        ${a.place ? `<span class="mchip">${I.pin}${esc(a.place)}</span>` : ""}
      </div>
      ${a.text ? `<p class="view-text">${esc(a.text)}</p>` : ""}`;
    const del = $("v-del"); del.classList.remove("sure"); del.textContent = "Sil"; del.disabled = false;
    $("vdlg").showModal();
  }
  $("v-edit").onclick = () => { $("vdlg").close(); openForm(viewing); };
  $("v-del").onclick = async () => {
    const del = $("v-del");
    if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "Emin misin? Sil"; return; }
    del.disabled = true;
    try { await removeItem(viewing.id); $("vdlg").close(); } catch (e) { del.disabled = false; del.textContent = "Silinemedi"; }
  };

  /* ---------- form ---------- */
  const curType = () => (document.querySelector('input[name="e-type"]:checked') || {}).value || "etkinlik";
  function applyType() {
    const t = curType();
    document.querySelectorAll("#eform [data-for]").forEach((el) => { el.hidden = !el.dataset.for.split(" ").includes(t); });
    $("e-date-lbl").textContent = t === "haber" ? "Haber tarihi *" : t === "duyuru" ? "Duyurunun günü *" : "Etkinlik günü *";
    $("e-text-lbl").textContent = t === "haber" ? "Haber metni" : t === "duyuru" ? "Duyuru metni" : "Açıklama";
    $("e-title").placeholder = t === "haber" ? "örn. Şenliğe yoğun katılım" : t === "duyuru" ? "örn. Kayıtlar başladı" : "örn. Cuma akşamı buluşma";
    if (!editing) $("e-title-h").textContent = "Yeni " + TYPES[t].toLocaleLowerCase("tr");
  }
  document.querySelectorAll('input[name="e-type"]').forEach((r) => r.addEventListener("change", applyType));
  function setImgPreview() {
    $("e-img-prev").hidden = !imgData; $("e-img-clear").hidden = !imgData;
    if (imgData) $("e-img-prev").src = imgData; else $("e-img-prev").removeAttribute("src");
  }
  function openForm(a, typeHint) {
    editing = a || null;
    const t = a ? typeOf(a) : (typeHint || "etkinlik");
    $("e-type-" + t).checked = true;
    $("e-title").value = a?.title || "";
    $("e-date").value = a?.date || (t === "haber" ? addDays(0) : addDays(1));
    $("e-time").value = a?.time || ""; $("e-end").value = a?.endTime || ""; $("e-place").value = a?.place || "";
    $("e-text").value = a?.text || ""; $("e-imp").checked = !!a?.important;
    imgData = a?.image || ""; setImgPreview();
    $("e-err").hidden = true;
    $("e-save").textContent = a ? "Kaydet" : "Yayınla";
    if (a) $("e-title-h").textContent = { etkinlik: "Etkinliği düzenle", duyuru: "Duyuruyu düzenle", haber: "Haberi düzenle" }[t];
    applyType();
    $("edlg").showModal(); $("e-title").focus();
  }
  $("e-img-clear").onclick = () => { imgData = ""; setImgPreview(); };
  $("e-img").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const W = Math.min(800, img.width), H = Math.round(img.height * W / img.width);
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      c.getContext("2d").drawImage(img, 0, 0, W, H);
      let q = 0.75, out = c.toDataURL("image/jpeg", q);
      while (out.length > 180000 && q > 0.35) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      imgData = out; URL.revokeObjectURL(url); setImgPreview();
    };
    img.onerror = () => { $("e-err").textContent = "Bu fotoğraf açılamadı, başka bir dosya dene."; $("e-err").hidden = false; };
    img.src = url; e.target.value = "";
  });
  $("eform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const t = curType(), title = $("e-title").value.trim(), date = $("e-date").value;
    if (!title || !parseDay(date)) { $("e-err").textContent = !title ? "Başlık boş olamaz." : "Bir tarih seç."; $("e-err").hidden = false; return; }
    const a = { id: editing ? editing.id : newId(), type: t, title, date, text: $("e-text").value.trim(), updatedAt: new Date().toISOString() };
    if (t !== "haber") { a.time = $("e-time").value; a.important = $("e-imp").checked; }
    if (t === "etkinlik") { a.endTime = $("e-end").value; a.place = $("e-place").value.trim(); }
    if (t === "haber" && imgData) a.image = imgData;
    const btn = $("e-save"); btn.disabled = true;
    try {
      await saveItem(a); $("edlg").close();
      const target = { etkinlik: "etkinlikler", duyuru: "duyurular", haber: "haberler" }[t];
      if (tab !== "gundem" && tab !== target) setTab(target); else render();
    } catch (err) {
      $("e-err").textContent = err && err.code === "invalid_argument" ? "Bu sayfaya kayıt ekleme iznin yok." : err && err.code === "quota_exceeded" ? "Kayıt alanı doldu; eski kayıtları silip tekrar dene." : "Kaydedilemedi, tekrar dene.";
      $("e-err").hidden = false;
    } finally { btn.disabled = false; }
  });
  document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));

  /* ---------- başlatma ---------- */
  function startLocal(note) {
    mode = "local";
    try { siteIg = localStorage.getItem(IG_KEY) || ""; } catch (e) { siteIg = ""; }
    let saved = null; try { const t = localStorage.getItem(LS_KEY); saved = t ? JSON.parse(t) : null; } catch (e) {}
    items = saved || EXAMPLES.map((a) => ({ ...a }));
    if (!saved) lsWrite();
    $("notice").textContent = note || "Kayıtlar bu cihazda, tarayıcıda saklanıyor.";
    renderIg(); render();
  }
  async function startDb() {
    $("notice").textContent = "Kayıtlar yükleniyor…";
    let ns = null;
    try { ns = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { ns = null; }
    if (!ns) { startLocal(); return; }
    db = ns; mode = "db";
    db.doc("settings/site").onSnapshot((d) => { siteIg = (d.exists && d.data().instagram) || ""; renderIg(); }, () => {});
    const timer = setTimeout(() => { $("notice").textContent = "Kayıtlara henüz ulaşılamadı, bağlantı bekleniyor…"; }, 10000);
    db.collection("announcements").onSnapshot((snap) => {
      items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { clearTimeout(timer); $("notice").textContent = "Kayıtlar bu sayfada saklanıyor; sayfayı açan herkes görür."; }
      render();
    }, (err) => { clearTimeout(timer); $("notice").textContent = "Kayıtlar okunamadı (" + err.code + ")."; });
  }

  /* ---------- olaylar ---------- */
  const addNew = () => openForm(null, TAB_TYPE[tab] || "etkinlik");
  $("add-btn").onclick = addNew; $("fab").onclick = addNew;
  $("search").addEventListener("input", (e) => { query = e.target.value.trim().toLocaleLowerCase("tr"); render(); });
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });
  document.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]"); if (go) { setTab(go.dataset.go); return; }
    const pb = e.target.closest("[data-past]"); if (pb) { showPast[pb.dataset.past] = !showPast[pb.dataset.past]; render(); return; }
    const c = e.target.closest("#main [data-id]"); if (c) { const a = items.find((x) => x.id === c.dataset.id); if (a) openView(a); }
  });
  window.addEventListener("hashchange", () => setTab(location.hash.slice(1)));

  tab = ["gundem", "etkinlikler", "duyurular", "haberler"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "gundem";
  renderIg(); render();
  if (window.claude && window.claude.use) startDb(); else startLocal();
})();
</script>

</body>
</html>
